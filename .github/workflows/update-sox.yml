name: Update SOX index close
on:
  schedule:
    # 05:00, 06:00 and 07:00 Beijing time; covers US summer/winter closes.
    - cron: '0 21,22,23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-sox
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_sox.py
      - name: Commit changed quote
        run: |
          if git diff --quiet -- sox.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sox.json
          git commit -m 'Update SOX index close'
          git push
