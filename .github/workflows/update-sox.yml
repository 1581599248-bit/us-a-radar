name: Update SOX index quote
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sox.yml'
      - 'scripts/update_sox.py'
  schedule:
    # Every five minutes across US summer and winter trading hours.
    - cron: '*/5 13-23 * * 1-5'
    - cron: '*/5 0-2 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-sox
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_sox.py
      - name: Commit changed quote
        run: |
          if git diff --quiet -- sox.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sox.json
          git commit -m 'Update SOX index quote'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
